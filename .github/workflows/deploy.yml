name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the wait step below lists this run's artifacts

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # tsc proves the shape, test.mjs proves the data. Bad data never ships.
      - run: npm test
      - name: Assemble site
        run: |
          mkdir -p out/dist out/icons out/fonts
          cp index.html privacy.html style.css .nojekyll out/
          cp dist/*.js out/dist/
          cp icons/*.png out/icons/
          cp fonts/*.woff2 out/fonts/
      # Pages sends max-age=14400 and Cloudflare caches it, so without a version tag a new
      # index.html can load four-hour-old scripts. The commit sha gives every deploy new URLs.
      - name: Version-tag scripts and stylesheet
        run: |
          sed -i -E "s|(src=\"dist/app\.js)\"|\1?v=${GITHUB_SHA}\"|; s|(href=\"style\.css)\"|\1?v=${GITHUB_SHA}\"|" out/index.html
          sed -i -E "s|(from '\./[a-z]+\.js)'|\1?v=${GITHUB_SHA}'|g" out/dist/*.js
          # modulepreload hrefs must match the tagged import URLs, or the preload is wasted.
          sed -i -E "s|(rel=\"modulepreload\" href=\"dist/[a-z]+\.js)\"|\1?v=${GITHUB_SHA}\"|g" out/index.html
          ! grep -E 'modulepreload" href="dist/[a-z]+\.js"' out/index.html
          grep -q "app.js?v=${GITHUB_SHA}" out/index.html
          sed -i -E "s|(href=\"style\.css)\"|\1?v=${GITHUB_SHA}\"|" out/privacy.html
          grep -q "style.css?v=${GITHUB_SHA}" out/index.html
          ! grep -E "from '\./[a-z]+\.js'" out/dist/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      # deploy-pages often found 0 artifacts right after a successful upload (most runs on 2026-11-24
      # and 25 failed this way): the listing lags the upload. Wait until the run lists it.
      - name: Wait until the artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" -q '[.artifacts[] | select(.name == "github-pages")] | length')
            [ "$n" -gt 0 ] && echo "listed after $i tries" && exit 0
            sleep 2
          done
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
