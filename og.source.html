<!doctype html>
<!-- Source for icons/og.png (1200x630), the share preview. Not deployed.
     Render: open at 1200x630 in headless Chromium once the fonts have loaded and screenshot the
     viewport. Colours, ridge and type are copied from style.css and the first-visit hero in src/app.ts. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Grenze:wght@700&family=IBM+Plex+Sans:wght@400&family=IBM+Plex+Mono:wght@500&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #0c0e11; color: #ece3cf; font-family: 'IBM Plex Sans', sans-serif; position: relative; }
  .glow { position: absolute; inset: 0; background: radial-gradient(120% 80% at 78% 108%, rgb(216 161 58 / 0.30), rgb(216 161 58 / 0.06) 42%, rgb(12 14 17 / 0) 68%); }
  .ridge { position: absolute; left: 0; bottom: 0; width: 1200px; height: 630px; }
  .frame { position: absolute; inset: 28px; border: 1px solid #2a3038; border-radius: 2px; }
  .copy { position: absolute; left: 96px; top: 92px; right: 96px; display: flex; flex-direction: column; gap: 26px; }
  .eyebrow { display: flex; align-items: center; gap: 18px; color: #d8a13a; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; letter-spacing: 0.2em; }
  .eyebrow svg { width: 52px; height: 52px; }
  h1 { font-family: 'Grenze', serif; font-weight: 700; font-size: 104px; line-height: 1.02; }
  p { font-size: 28px; line-height: 1.45; color: #b9b3a2; max-width: 820px; }
  .stats { position: absolute; left: 96px; bottom: 74px; display: flex; gap: 30px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 20px; color: #b9b3a2; }
  .stats i { display: inline-block; width: 16px; height: 16px; border-radius: 2px; margin-right: 10px; vertical-align: -1px; }
  .url { position: absolute; right: 96px; bottom: 72px; font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 22px; letter-spacing: 0.04em; color: #f2c76d; }
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="ridge" viewBox="0 0 1400 440" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,440 250,208 470,440" fill="#14171c"></polygon>
    <polygon points="300,440 620,150 940,440" fill="#1b1f26"></polygon>
    <polygon points="820,440 1080,232 1400,440" fill="#14171c"></polygon>
    <polygon points="560,196 620,150 680,196 650,214 620,190 590,214" fill="#2a3038"></polygon>
    <rect x="0" y="318" width="1400" height="2" fill="#2a3038" opacity=".55"></rect>
    <rect x="0" y="352" width="1400" height="2" fill="#2a3038" opacity=".4"></rect>
    <rect x="0" y="386" width="1400" height="2" fill="#2a3038" opacity=".25"></rect>
  </svg>
  <div class="frame"></div>
  <div class="copy">
    <div class="eyebrow">
      <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4.8 12 19.4 18 4.8"></path><path d="M3.4 4.8h5.2M15.4 4.8h5.2"></path></g></svg>
      VALHEIM FOOD PLANNER
    </div>
    <h1>Three foods.<br>The right three.</h1>
    <p>Best food per build and a gather list, with nothing from biomes you have not reached.</p>
  </div>
  <div class="stats"><span><i style="background:#ef6b5e"></i>health</span><span><i style="background:#e8c24a"></i>stamina</span><span><i style="background:#6ea8ff"></i>eitr</span></div>
  <div class="url">buildapp.se/valheim</div>
</body>
</html>
